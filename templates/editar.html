{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-7">

        <div class="card task-card">

            <div class="card-body p-4">

                <div class="mb-4">
                    <h2 class="fw-bold">Editar tarefa</h2>
                    <p class="text-muted mb-0">
                        Altere as informações da tarefa.
                    </p>
                </div>

                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Título
                        </label>

                        <input
                            type="text"
                            name="titulo"
                            class="form-control"
                            value="{{ tarefa.titulo }}"
                            maxlength="150"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Descrição
                        </label>

                        <textarea
                            name="descricao"
                            class="form-control"
                            rows="5"
                            placeholder="Descreva os detalhes da tarefa..."
                        >{{ tarefa.descricao or "" }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Prioridade
                        </label>

                        <select
                            name="prioridade"
                            class="form-select"
                            required
                        >

                            <option
                                value="baixa"
                                {% if tarefa.prioridade == "baixa" %}
                                    selected
                                {% endif %}
                            >
                                Baixa
                            </option>

                            <option
                                value="media"
                                {% if tarefa.prioridade == "media" %}
                                    selected
                                {% endif %}
                            >
                                Média
                            </option>

                            <option
                                value="alta"
                                {% if tarefa.prioridade == "alta" %}
                                    selected
                                {% endif %}
                            >
                                Alta
                            </option>

                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">
                            Status
                        </label>

                        <select
                            name="status"
                            class="form-select"
                            required
                        >

                            <option
                                value="pendente"
                                {% if tarefa.status == "pendente" %}
                                    selected
                                {% endif %}
                            >
                                Pendente
                            </option>

                            <option
                                value="concluida"
                                {% if tarefa.status == "concluida" %}
                                    selected
                                {% endif %}
                            >
                                Concluída
                            </option>

                        </select>
                    </div>

                    <div class="d-flex justify-content-between">

                        <a
                            href="{{ url_for('index') }}"
                            class="btn btn-outline-secondary"
                        >
                            Cancelar
                        </a>

                        <button
                            type="submit"
                            class="btn btn-primary px-4"
                        >
                            Salvar alterações
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>
</div>

{% endblock %}
